# Grafana → Prometheus. 추천 엔진의 지표(reco_* · http_*)를 읽는다 (트랙 C, 2026-09-22).
#
# 옆의 postgres.yml 은 "Prometheus 를 쓰지 않는다" 고 적고 있다(설계 1-3). 그 전제는
# recommendation_log 에 지연과 처리량이 쌓인다는 것이었는데, 로그 적재가 아직 서빙에 연결되지
# 않았고(DB 전환 M-05) 운영 데이터는 백엔드 API 로만 오게 됐다. 그래서 DB 없이도 도는 관측을
# 따로 두었다. 둘은 겹치지 않는다 — PG 는 "무엇이 서빙됐는가", 이쪽은 "서빙이 어떻게 돌고 있는가".
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST
