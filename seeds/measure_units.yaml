# 계량 단위 상수표 — P5 수량 환산 (문서 4-6)
# 재료와 무관하게 고정. 개수 단위(개·대·쪽)는 ingredient_unit_weight.csv 로 분리.

volume_ml:            # 부피 단위 → ml
  큰술:      15
  큰수저:    15
  T:         15
  Tbsp:      15
  스푼:      15
  숟가락:    15        # ★실측 15,775건 — 미매칭 1위 단위였다
  숟갈:      15        #   〃 2,677건
  밥숟가락:  15        #   〃 542건
  Ts:        15        #   〃 2,330건 (대문자·소문자 혼용)
  TS:        15
  소주컵:    50        #   〃 301건
  작은술:     5
  작은수저:   5
  t:          5
  tsp:        5
  티스푼:     5
  컵:       200        # 한국 계량컵 표준
  종이컵:   180        # ★다름. 레시피에서 흔히 쓰임
  밥공기:   200
  국자:      60
  ts:         5        # ★실측 1,138건
  ml:         1
  cc:         1
  L:       1000
  리터:    1000

weight_g:             # 무게 단위 → g
  g:          1
  그램:       1
  그람:       1        # 오기 흡수
  kg:      1000
  킬로:    1000
  근:       600        # 고기 1근. 채소 1근은 375g이라 모호 → note 로 경고
  냥:        37.5

# ── 🔴 2026-09-02 실데이터 보강 ─────────────────────────────────
# 46,552건 실측에서 미매칭의 21.3%(27,071건)가 **수량이 안 떨어진 것**이었다.
# `양파 1개` 는 되는데 `소금 1꼬집` 이 안 됐다 — 단위 시드에 없어서다.
# 사전을 늘릴 문제가 아니라 여기를 채울 문제였다.

count_unit:           # 세는 단위 → 무게는 ingredient_unit_weight.csv 가 정한다
  - 꼬집              # 실측 2,810건
  - 줄                #   〃 1,391건
  - 조                #   〃 1,264건
  - 봉지              #   〃 1,702건
  - 줄기              #   〃 620건
  - 주먹              #   〃 606건
  - 움큼              #   〃 338건
  - 톨
  - 쪽
  - 알
  - 장
  - 마리
  - 포기
  - 단

length_cm:            # 길이 — 대파·무처럼 자르는 재료. 무게 환산은 재료별
  - cm                # 실측 972건
  - 센치
  - 센티

ambiguous:            # 수량을 확정할 수 없는 표현. qty=NULL 로 두고 P4 optional 신호로 사용
  - 솔솔              # 실측 — '통깨 솔솔'
  - 약간
  - 조금
  - 적당량
  - 적당히
  - 듬뿍
  - 살짝
  - 톡톡
  - 기호껏
  - 취향껏
  - 넉넉히

korean_numerals:      # 한글 수사 → 숫자
  한: 1
  두: 2
  세: 3
  네: 4
  다섯: 5
  여섯: 6
  일곱: 7
  여덟: 8
  아홉: 9
  열: 10
  반: 0.5

fraction_glyphs:      # 유니코드 분수 글리프
  "½": 0.5
  "⅓": 0.3333
  "⅔": 0.6667
  "¼": 0.25
  "¾": 0.75

# ⚠️ '근' 주의
#   고기 1근 = 600g, 채소·과일 1근 = 375g 으로 관행이 다르다.
#   P5 에서 재료 카테고리가 축산물이면 600, 농산물이면 375 로 분기하고
#   confidence 를 0.6 으로 낮춘다.
