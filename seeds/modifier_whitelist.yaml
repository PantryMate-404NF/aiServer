# L2 규칙 매칭 — 제거해도 의미가 바뀌지 않는 수식어 (문서 4-4)
#
# 🔴 화이트리스트 방식이다. 여기 없는 표현은 절대 건드리지 않는다.
#    블랙리스트(제거하면 안 되는 것 목록) 방식은 반드시 빠뜨린다.
#
# 검수 중 새 수식어가 발견되면 여기에 추가하고 전체 재정규화한다.

origin:               # 원산지·등급
  - 국내산
  - 국산
  - 수입산
  - 호주산
  - 미국산
  - 뉴질랜드산
  - 제주
  - 제주산
  - 유기농
  - 무농약
  - 친환경
  - 자연산
  - 양식
  - 햇                # 햇감자 → 감자
  - 1++
  - 1+
  - 등급

state:                # 상태·보관
  - 냉동
  - 냉장
  - 생물
  - 생                # ⚠️ 제거 후 2음절 이상 남을 때만 적용 (생강 → 강 방지)
  - 말린
  - 건조
  - 건
  - 삶은
  - 데친
  - 익힌
  - 손질된
  - 손질
  - 껍질벗긴
  - 세척
  - 씻은
  - 불린

brand:                # 브랜드
  - 백설
  - 청정원
  - 오뚜기
  - 해표
  - 사조
  - 동원
  - 풀무원
  - 대상
  - 샘표
  - CJ
  - 비비고
  - 하선정

packaging:            # 포장·용기
  - 1팩
  - 한팩
  - 팩
  - 한봉지
  - 봉지
  - 캔
  - 캔입
  - 대용량

filler:               # 무의미 접두·접미
  - 신선한
  - 좋은
  - 맛있는
  - 통째
  - 다용도

# ── 🔴 제거 금지 (참고용. 코드는 화이트리스트만 본다) ──────
# 아래는 "수식어처럼 보이지만 재료명의 일부"인 예시다.
# 실수로 화이트리스트에 추가하지 않도록 남긴다.
do_not_remove_examples:
  - 다진마늘        # ≠ 마늘. 별도 staple 재료
  - 다진생강        # ≠ 생강
  - 찹쌀            # ≠ 쌀
  - 현미            # ≠ 쌀
  - 흑설탕          # ≠ 설탕
  - 왕만두          # ≠ 만두
  - 알배추          # ≠ 배추 (크기 아닌 품종)
  - 애호박          # ≠ 호박
  - 단호박          # ≠ 호박
  - 생크림          # ≠ 크림 ('생' 제거 시 사고)
  - 생강            # '생' 제거 시 '강' 이 됨
