# fuzzy(L3) · embedding(L4) 매칭 금지 쌍 (문서 4-4)
#
# 문자열이나 의미가 비슷하지만 요리에서 대체 불가능한 재료들.
# 이 쌍에 걸리면 L3/L4 매칭을 거부하고 normalization_queue 로 보낸다.
#
# 검수 중 오탐이 발견될 때마다 여기에 추가한다. 늘어나는 것이 정상이다.

pairs:
  # ── 기름류 ──────────────────────────────
  - [참기름, 들기름]
  - [참기름, 식용유]
  - [들기름, 식용유]
  - [올리브유, 포도씨유]

  # ── 장류 ────────────────────────────────
  - [진간장, 국간장]
  - [진간장, 양조간장]
  - [국간장, 양조간장]
  - [된장, 쌈장]
  - [된장, 청국장]
  - [고추장, 초고추장]
  - [고추장, 춘장]
  - [고춧가루, 고추장]

  # ── 곡물·가루 ──────────────────────────
  - [찹쌀, 쌀]
  - [찹쌀가루, 쌀가루]
  - [밀가루, 부침가루]
  - [부침가루, 튀김가루]
  - [전분, 밀가루]
  - [빵가루, 밀가루]

  # ── 당류 ────────────────────────────────
  - [설탕, 흑설탕]
  - [올리고당, 물엿]
  - [꿀, 조청]

  # ── 채소 (임베딩상 매우 가까움) ─────────
  - [대파, 쪽파]
  - [대파, 양파]
  - [양파, 마늘]
  - [부추, 미나리]
  - [애호박, 단호박]
  - [고구마, 감자]
  - [무, 열무]
  - [배추, 알배추]
  - [청양고추, 풋고추]
  - [깻잎, 상추]

  # ── 육류 부위 ──────────────────────────
  - [삼겹살, 목살]
  - [소등심, 소안심]
  - [돼지등심, 돼지안심]
  - [닭가슴살, 닭안심]

  # ── 수산 ────────────────────────────────
  - [명태, 동태]        # 상태 다름. 조리법이 달라짐
  - [멸치, 잔멸치]
  - [미역, 다시마]
  - [김, 파래]

  # ── 유가공 ──────────────────────────────
  - [생크림, 우유]
  - [버터, 마가린]
  - [플레인요거트, 사워크림]

# 자모 유사 오타는 여기 넣지 않는다 — 그건 정상 매칭이다.
#   청양고추 ↔ 청량고추 (오타) → alias 로 처리
#   애호박   ↔ 얘호박   (오타) → alias 로 처리
