# 재료가 아닌 표현 — P1 에서 걸러낸다 (설계 4-2 · 2026-09-02 신설)
#
# ## 왜 필요한가
#
# 만개의레시피는 **재료 목록에 조리도구를 섞어 넣는다.** 실측(46,552건):
#
#     도마 ×2,259 · 조리용나이프 ×1,784 · 냄비 ×1,124 · 요리스푼 ×1,071 · 프라이팬 ×926
#
# 이것들이 미매칭으로 잡히면 두 가지가 동시에 나빠진다:
#   1. 커버리지가 실제보다 낮게 보인다 (분모에 도구가 들어간다)
#   2. **검수 큐가 오염된다** — 검수자가 "도마를 어느 재료에 매칭할까요"를 2,259번 본다
#
# ## 🔴 사전에 등록하는 것과 다르다
#
# 도구를 `ingredient` 에 넣으면 안 된다. 그러면 레시피가 "도마를 재료로 쓴다"가 되고
# `essential_ids` 에 들어가 Retrieval 이 망가진다. **매칭 대상에서 아예 빼는 것**이 맞다.
#
# ## 분류
#
#   tool      조리도구 — 냄비·프라이팬·도마
#   vessel    담는 것 — 그릇·접시·용기
#   consumable 소모품 — 키친타월·랩·이쑤시개
#   action    조리 동작이 재료 칸에 들어온 것 — 준비물·기타

