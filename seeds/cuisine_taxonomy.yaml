# 요리 계열 분류 사전 → cuisine_taxonomy 테이블 (문서 2-3-1)
#
# 2계층: family(거친 축, 다양성 제어) ← cuisine(세분 축, 표시·필터)
# 분류 규칙은 2026-09-17 에 구현했다 (G-30, 안 b). 아래 rules 참조.
#    분포가 나쁜 fine 값은 active: false 로 접는다 (스키마 변경 불필요).

taxonomy:
  - {code: korean,          family: korean,       label_ko: 한식,        label_en: Korean,          active: true,  sort_order: 10}

  - {code: chinese,         family: chinese,      label_ko: 중식,        label_en: Chinese,         active: true,  sort_order: 20}
  - {code: korean_chinese,  family: chinese,      label_ko: 한국식 중화, label_en: Korean-Chinese,  active: true,  sort_order: 21}

  - {code: japanese,        family: japanese,     label_ko: 일식,        label_en: Japanese,        active: true,  sort_order: 30}
  - {code: izakaya,         family: japanese,     label_ko: 이자카야,    label_en: Izakaya,         active: false, sort_order: 31}

  - {code: italian,         family: western,      label_ko: 이탈리안,    label_en: Italian,         active: true,  sort_order: 40}
  - {code: french,          family: western,      label_ko: 프렌치,      label_en: French,          active: false, sort_order: 41}
  - {code: american,        family: western,      label_ko: 아메리칸,    label_en: American,        active: true,  sort_order: 42}
  - {code: mexican,         family: western,      label_ko: 멕시칸,      label_en: Mexican,         active: true,  sort_order: 43}
  - {code: spanish,         family: western,      label_ko: 스페인,      label_en: Spanish,         active: false, sort_order: 44}
  - {code: mediterranean,   family: western,      label_ko: 지중해,      label_en: Mediterranean,   active: false, sort_order: 45}

  - {code: thai,            family: asian_other,  label_ko: 태국,        label_en: Thai,            active: true,  sort_order: 50}
  - {code: vietnamese,      family: asian_other,  label_ko: 베트남,      label_en: Vietnamese,      active: true,  sort_order: 51}
  - {code: indian,          family: asian_other,  label_ko: 인도,        label_en: Indian,          active: false, sort_order: 52}

  - {code: fusion,          family: fusion,       label_ko: 퓨전,        label_en: Fusion,          active: true,  sort_order: 60}

# ⚠️ 비대칭 주의 (문서 2-3-1)
#   mexican 을 western family 에 넣은 것은 요리 전통이 아니라 "한국인의 인식 범주"를 따른 결정이다.
#   family = 인식 범주 / fine = 실제 전통. 이 비대칭을 모르면 반드시 재논쟁이 생긴다.
#
# active: false 인 6종은 초기 비활성이다. 크롤링 분포에서 각 200건 이상 확인되면 켠다.

# ── 분류 규칙 (G-30 안 b · 2026-09-17 구현) ──────────────
#
# 원본에 분류축이 없다. `raw_json.categories` 는 고유 45,529종 자유 태그라
# 축으로 안 접히고, recipe.dish_type/cuisine/main_ing_cat 은 실측 전수 0건이다.
# 그래서 **있는 것**(태그 일부 · 제목 · 재료)으로 만든다.
#
# 🔴 순서가 규칙의 절반이다. 위에서 걸리면 거기서 끝낸다.
#    ① 태그  ② 비한식 제목  ③ 한식 제목  ④ 시그니처 재료
#
#    비한식을 한식보다 먼저 보는 이유: '김치파스타' 는 양식이어야 한다.
#    한식 제목을 재료보다 먼저 보는 이유: 다진마늘·참기름·고춧가루가 거의 모든
#    레시피에 있어서(실측 27,359건), 재료를 먼저 보면 전부 한식이 된다.
#
# 🔴 전부 실패하면 NULL 이다. 억지로 채우지 않는다.
#    한식으로 폴백하면 배정률이 100% 가 되지만, 그 21,967건 중에 분류 못 한
#    양식·퓨전이 섞여 있고 한식으로 박으면 그 사용자가 영영 못 만난다.
#    실측 배정률 61.7% 이고, 비한식 계열은 폴백을 켜도 숫자가 같다.
#
# 실측 (46,353건 · 2026-09-17):
#    배정 28,621 (61.7%) — korean 21,052 · western 5,294 · japanese 846 ·
#                          chinese 796 · asian_other 589 · fusion 44
rules:
  priority: [by_source_tag, by_title_non_korean, by_title_korean, by_signature_ingredients]

  # ① 원본 태그에 계열 이름이 그대로 있는 것. 390건뿐이지만 가장 확실하다
  by_source_tag:
    conf: 0.9
    map:
      한식: korean
      중식: chinese
      일식: japanese
      양식: western
      퓨전: fusion
      아시안: asian_other
      동남아: asian_other

  # ② 그 계열 밖에서는 안 쓰는 요리 이름. 한식보다 먼저 본다
  by_title_non_korean:
    conf: 0.7
    map:
      chinese:     [짜장, 짬뽕, 마파, 탕수, 깐풍, 유린기, 양장피, 고추잡채, 훠궈, 멘보샤]
      japanese:    [돈부리, 규동, 우동, 소바, 라멘, 오코노미야키, 가라아게, 텐동, 스시,
                    초밥, 나베, 야끼, 돈카츠, 돈까스, 오니기리]
      asian_other: [팟타이, 쌀국수, 분짜, 반미, 나시고랭, 똠얌, 월남쌈, 커리, 카레]
      western:     [파스타, 리조또, 스테이크, 그라탕, 라자냐, 뇨끼, 피자, 버거, 샌드위치,
                    오믈렛, 브런치, 리소토, 크림스프, 까르보나라, 알리오,
                    샐러드, 스프, 수프, 토스트, 쿠키, 케이크, 머핀, 브라우니]

  # ③ 한식 조리법·요리 이름. 다른 계열에서 거의 안 쓰는 것만 넣는다
  #    주의: 볶음·구이·전·국·튀김은 뺐다. 중식·일식과 겹쳐서 넣으면 배정률은
  #       83.9% 로 오르지만 중식이 798→770, 양식이 5,294→5,249 로 줄어든다.
  #       남의 계열을 잡아먹는다는 뜻이다.
  by_title_korean:
    conf: 0.7
    keywords: [찌개, 김치, 나물, 무침, 조림, 젓갈, 장아찌, 비빔, 국밥, 탕, 쌈,
               전골, 찜, 부침개, 수육, 불고기, 떡볶이, 잡채, 삼겹, 제육, 닭갈비,
               된장, 고추장, 쌈장, 깍두기, 겉절이, 육개장, 갈비, 순대, 부대찌개,
               반찬, 밑반찬]

  # ④ 그 계열 밖에서는 거의 안 쓰는 재료. min 개 이상 겹쳐야 인정한다
  #    한식은 넣지 않는다 — 위 주석대로 27,359건을 잡아 다른 규칙을 덮는다
  by_signature_ingredients:
    conf: 0.6
    min: 2
    map:
      japanese:    [미소된장, 미림, 가쓰오부시, 폰즈소스, 낫토, 유자청, 쯔유]
      chinese:     [두반장, 굴소스, 춘장, 화자오, 노두유]
      asian_other: [피시소스, 코코넛밀크, 고수, 레몬그라스, 스위트칠리소스]
      western:     [올리브유, 생크림, 파마산치즈, 바질, 오레가노, 모짜렐라치즈]

  fallback: null                 # ★전부 실패 → NULL. 억지로 채우지 않는다
